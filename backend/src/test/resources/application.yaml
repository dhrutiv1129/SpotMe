spring:
  application:
    name: backend
  datasource:
    url: jdbc:h2:mem:spotme-tests;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
spotme:
  allowed-origins: http://localhost:8081
logging:
  level:
    root: WARN
    org.springframework: WARN
