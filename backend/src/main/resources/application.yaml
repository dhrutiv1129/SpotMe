spring:
  application:
    name: backend
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:h2:file:./data/beta/spotme;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spotme:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:8081,http://127.0.0.1:8081}
logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate: WARN
