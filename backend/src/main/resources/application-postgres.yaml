spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-init-sql: SET search_path TO spotme_beta
  flyway:
    default-schema: spotme_beta
    schemas: spotme_beta
