services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: spotme
      POSTGRES_USER: spotme
      POSTGRES_PASSWORD: ${BETA_DATABASE_PASSWORD:?Set BETA_DATABASE_PASSWORD in your local .env}
    volumes:
      - beta_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotme -d spotme"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DATABASE_URL: jdbc:postgresql://database:5432/spotme
      DATABASE_USERNAME: spotme
      SUPABASE_DB_PASSWORD: ${BETA_DATABASE_PASSWORD:?Set BETA_DATABASE_PASSWORD in your local .env}
      SERVER_ADDRESS: 0.0.0.0
      ALLOWED_ORIGINS: ${BETA_ORIGIN:-http://localhost:8080}
    depends_on:
      database:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
volumes:
  beta_database:
